<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Roblox Studio</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; height: 100vh; font-family: sans-serif; background: #1e1e1e; color: white; }
        #viewport { flex: 1; position: relative; }
        canvas { display: block; }
        
        /* CoreGui e Chat */
        #core-gui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #chat-box { position: absolute; top: 10px; left: 10px; width: 250px; height: 150px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow-y: auto; padding: 5px; color: white; font-size: 12px; pointer-events: auto; }
        #chat-input { position: absolute; top: 165px; left: 10px; width: 250px; background: rgba(0,0,0,0.7); border: 1px solid #555; color: white; padding: 5px; border-radius: 5px; pointer-events: auto; display: none; }
        #voice-btn { position: absolute; bottom: 20px; right: 20px; padding: 15px; background: #0055ff; color: white; border: none; border-radius: 50%; cursor: pointer; pointer-events: auto; font-weight: bold; font-size: 20px; }
        
        /* Painel de Código */
        #sidebar { width: 350px; background: #2d2d2d; display: flex; flex-direction: column; border-left: 2px solid #444; }
        .code-section { flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid #444; }
        .code-header { background: #111; padding: 5px; font-size: 12px; font-weight: bold; color: #aaa; }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 10px; font-family: monospace; font-size: 12px; resize: none; outline: none; }
        #play-btn { padding: 15px; background: #00b06b; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        #status { padding: 10px; background: #000; color: #00ff00; font-size: 11px; font-family: monospace; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="core-gui">
            <div id="chat-box"></div>
            <input type="text" id="chat-input" placeholder="Pressione / para conversar...">
            <button id="voice-btn">🎤</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="code-section">
            <div class="code-header">ServerScriptService</div>
            <textarea id="server-code" spellcheck="false">
-- Roda no Servidor (Worker)
local DataStore = game:GetService("DataStoreService"):GetDataStore("PlayerData")
local ReplicatedStorage = game:GetService("ReplicatedStorage")

local parte = Instance.new("Part")
parte.Position = {x = 0, y = 2, z = 0}
parte.Color = "#ff0000"

DataStore:SetAsync("Player_1", {coins = 500})
game:GetService("Chat"):SendMessage("Servidor", "Servidor iniciado com sucesso!")
            </textarea>
        </div>
        <div class="code-section">
            <div class="code-header">LocalScript (StarterPlayerScripts)</div>
            <textarea id="client-code" spellcheck="false">
-- Roda no Cliente (Worker)
local CoreGui = game:GetService("CoreGui")
local CorePackages = game:GetService("CorePackages")

CoreGui:SetCore("SendNotification", {
    Title = "Bem-vindo",
    Text = "O jogo carregou no seu celular!"
})
            </textarea>
        </div>
        <button id="play-btn">▶ RODAR JOGO</button>
        <div id="status">Console...</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module" src="./js/studio.js"></script>
</body>
</html>
